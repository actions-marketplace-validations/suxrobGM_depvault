name: "Setup DepVault CLI"
description: "Install the DepVault CLI for dependency analysis, environment vault, and secret management"
author: "suxrobGM"

branding:
  icon: "shield"
  color: "green"

inputs:
  version:
    description: "CLI version to install (e.g. 'v1.1.0'). Defaults to latest."
    required: false
    default: "latest"
  token:
    description: "DepVault CI token. Sets DEPVAULT_TOKEN for subsequent steps."
    required: false

runs:
  using: "composite"
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        # RUNNER_OS/RUNNER_ARCH are set on every runner incl. Windows (bash ships via Git Bash).
        case "$RUNNER_OS" in
          Linux)   OS_NAME="linux" ;;
          macOS)   OS_NAME="osx" ;;
          Windows) OS_NAME="win" ;;
          *)       echo "::error::Unsupported OS: $RUNNER_OS"; exit 1 ;;
        esac

        case "$RUNNER_ARCH" in
          X64)   ARCH_NAME="x64" ;;
          ARM64) ARCH_NAME="arm64" ;;
          *)     echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
        esac

        RID="${OS_NAME}-${ARCH_NAME}"
        echo "rid=$RID" >> "$GITHUB_OUTPUT"
        echo "os_name=$OS_NAME" >> "$GITHUB_OUTPUT"

    - name: Resolve version
      id: version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        REPO="suxrobGM/depvault"

        if [ "$REQUESTED_VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL "https://api.github.com/repos/${REPO}/releases" \
            | grep -o '"tag_name": *"cli/v[^"]*"' \
            | head -1 \
            | sed 's/.*"cli\/\(v[^"]*\)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine latest CLI version"
            exit 1
          fi
        else
          VERSION="$REQUESTED_VERSION"
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=cli/${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Download and install (Unix)
      if: steps.platform.outputs.os_name != 'win'
      shell: bash
      env:
        RID: ${{ steps.platform.outputs.rid }}
        VERSION: ${{ steps.version.outputs.version }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        REPO="suxrobGM/depvault"
        ARCHIVE="depvault-${RID}.tar.gz"
        URL="https://github.com/${REPO}/releases/download/${TAG}/${ARCHIVE}"
        INSTALL_DIR="${HOME}/.depvault/bin"

        mkdir -p "$INSTALL_DIR"

        echo "Downloading DepVault CLI ${VERSION} for ${RID}..."
        curl -fsSL -o "/tmp/${ARCHIVE}" "$URL"
        tar -xzf "/tmp/${ARCHIVE}" -C "$INSTALL_DIR"
        chmod +x "${INSTALL_DIR}/depvault"
        rm -f "/tmp/${ARCHIVE}"

        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
        echo "DepVault CLI ${VERSION} installed to ${INSTALL_DIR}"

    - name: Download and install (Windows)
      if: steps.platform.outputs.os_name == 'win'
      shell: pwsh
      env:
        RID: ${{ steps.platform.outputs.rid }}
        VERSION: ${{ steps.version.outputs.version }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        $repo = "suxrobGM/depvault"
        $archive = "depvault-$env:RID.zip"
        $url = "https://github.com/$repo/releases/download/$env:TAG/$archive"
        $installDir = "$env:USERPROFILE\.depvault\bin"

        New-Item -ItemType Directory -Force -Path $installDir | Out-Null

        Write-Host "Downloading DepVault CLI $env:VERSION for $env:RID..."
        $tmp = "$env:RUNNER_TEMP\$archive"
        Invoke-WebRequest -Uri $url -OutFile $tmp
        Expand-Archive -Path $tmp -DestinationPath $installDir -Force
        Remove-Item $tmp

        Add-Content -Path $env:GITHUB_PATH -Value $installDir
        Write-Host "DepVault CLI $env:VERSION installed to $installDir"

    - name: Set DEPVAULT_TOKEN
      if: inputs.token != ''
      shell: bash
      run: echo "DEPVAULT_TOKEN=${{ inputs.token }}" >> "$GITHUB_ENV"

    - name: Verify installation
      shell: bash
      run: depvault version
