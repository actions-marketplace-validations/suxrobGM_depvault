name: Test CI Pull

on:
  workflow_dispatch:

jobs:
  test-ci-pull:
    name: Test depvault pull with a CI token
    runs-on: ubuntu-latest

    steps:
      # The checkout provides .depvault.json, whose folder is the root files are restored under.
      - uses: actions/checkout@v4

      - name: Setup DepVault CLI
        uses: suxrobGM/depvault@v1
        with:
          token: ${{ secrets.DEPVAULT_TOKEN }}

      - name: Pull files
        run: |
          touch "$RUNNER_TEMP/before-pull"
          depvault pull

      - name: Verify files were restored
        run: |
          files=$(find . -type f -newer "$RUNNER_TEMP/before-pull" -not -path './.git/*')
          if [ -z "$files" ]; then
            echo "::error::No files were restored"
            exit 1
          fi
          echo "$files"
          echo "Restored $(echo "$files" | wc -l) file(s)"
