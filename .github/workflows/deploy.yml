# Docker-based deployment to VPS via GitHub Container Registry
#
# Required GitHub Secrets:
# - SSH_HOST: VPS IP address or hostname
# - SSH_USER: SSH username
# - SSH_KEY: SSH private key for VPS access
# - ENV_DOCKER: Full contents of the production .env file (temporary, for VPS migration)
# - DEPVAULT_TOKEN: DepVault CI token that can read deploy/.env (disabled during VPS migration)
#
# Required GitHub Variables (Settings → Secrets and variables → Actions → Variables tab):
# - NEXT_PUBLIC_API_URL: Public backend API URL (e.g. https://api.depvault.example.com)
# - NEXT_PUBLIC_TURNSTILE_SITE_KEY: Cloudflare Turnstile site key (pairs with TURNSTILE_SECRET_KEY in .env)

name: Build and Deploy

on:
  # workflow_run:
  #   workflows: ["CI"]
  #   branches: [prod]
  #   types: [completed]
  push:
    branches: [prod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_DIR: ~/deploy/depvault

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    # if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: build-${{ matrix.image }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            file: ./apps/backend/Dockerfile
          - image: frontend
            file: ./apps/frontend/Dockerfile
          - image: docs
            file: ./apps/docs/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image }}:buildcache,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Temporary: write .env from ENV_DOCKER secret while migrating to new VPS.
      # Restore the DepVault CLI steps below once the migration is complete.
      - name: Write .env from ENV_DOCKER secret
        run: |
          mkdir -p deploy
          printf '%s' "${{ secrets.ENV_DOCKER }}" > deploy/.env

      # - name: Setup DepVault CLI
      #   uses: suxrobGM/depvault@v1
      #   with:
      #     token: ${{ secrets.DEPVAULT_TOKEN }}
      #
      # - name: Pull deploy/.env from DepVault
      #   run: depvault pull deploy/.env

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/.env"
          target: ${{ env.APP_DIR }}
          strip_components: 1

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # `set -e`: a failed pull must not fall through to `up -d`, which
          # would silently recreate containers from stale cached images.
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # Images are public; a cached expired credential turns the
            # anonymous pull into `denied`.
            docker logout ghcr.io

            # Pull new images while old containers are still running
            docker compose pull

            # --wait blocks on the healthchecks declared in the compose file
            docker compose up -d --force-recreate --remove-orphans --wait --wait-timeout 180

            # Clean up old images
            docker image prune -f

            echo "=== Deployed Images ==="
            docker compose images
